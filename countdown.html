<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Surprise 🎂</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── ROOT ── */
    :root {
      --gold:   #FFD700;
      --rose:   #FF4D8B;
      --violet: #7B2FBE;
      --deep:   #05000F;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--deep);
      font-family: 'Poppins', sans-serif;
      color: #fff;
    }

    /* ── CANVAS (fireworks behind everything) ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── STARS ── */
    #stars {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d,3s) ease-in-out infinite var(--dl,0s);
    }
    @keyframes twinkle {
      0%,100% { opacity:.1; transform:scale(1); }
      50%      { opacity:1;  transform:scale(1.8); }
    }

    /* ── PARTICLES (hearts / emojis floating up) ── */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      bottom: -40px;
      font-size: var(--sz, 1.4rem);
      left: var(--lf, 50%);
      opacity: 0;
      animation: rise var(--dur,7s) ease-in var(--dl,0s) infinite;
    }
    @keyframes rise {
      0%   { opacity:0;   transform:translateY(0)   rotate(0deg); }
      10%  { opacity:.9; }
      100% { opacity:0;   transform:translateY(-105vh) rotate(720deg); }
    }

    /* ── MAIN WRAPPER ── */
    #wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 0;
      padding: 1.5rem;
      text-align: center;
    }

    /* ── TOP LABEL ── */
    .top-label {
      font-size: clamp(.75rem, 2vw, .9rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      margin-bottom: 2.2rem;
      animation: fadeDown .8s ease forwards;
    }
    @keyframes fadeDown {
      from { opacity:0; transform:translateY(-14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── MESSAGE ── */
    .msg {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      line-height: 1.4;
      background: linear-gradient(130deg, var(--gold) 0%, var(--rose) 55%, #b44bff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(255,77,139,.35));
      animation: fadeDown .8s .2s ease both;
      margin-bottom: 3.2rem;
    }

    /* ── COUNTDOWN RING ── */
    .ring-wrap {
      position: relative;
      width: 160px;
      height: 160px;
      margin-bottom: 3rem;
      animation: fadeDown .8s .4s ease both;
    }
    .ring-svg {
      width: 160px;
      height: 160px;
      transform: rotate(-90deg);
    }
    /* track */
    .ring-track {
      fill: none;
      stroke: rgba(255,255,255,.07);
      stroke-width: 6;
    }
    /* progress arc */
    .ring-prog {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 440;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
    /* number inside ring */
    .ring-num {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .ring-num span.big {
      font-family: 'Dancing Script', cursive;
      font-size: 4.5rem;
      line-height: 1;
      color: var(--gold);
      filter: drop-shadow(0 0 12px rgba(255,215,0,.6));
      transition: transform .25s ease, opacity .25s ease;
    }
    .ring-num span.small {
      font-size: .6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
    }
    /* pop animation when number changes */
    .pop {
      animation: numPop .35s ease;
    }
    @keyframes numPop {
      0%   { transform:scale(1);    opacity:1;  }
      30%  { transform:scale(1.35); opacity:.7; }
      100% { transform:scale(1);    opacity:1;  }
    }

    /* ── PROGRESS BAR ── */
    .bar-wrap {
      width: min(320px, 80vw);
      height: 4px;
      background: rgba(255,255,255,.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 2.8rem;
      animation: fadeDown .8s .5s ease both;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--violet), var(--rose), var(--gold));
      border-radius: 99px;
      transform-origin: left;
      transform: scaleX(1);
      transition: transform 1s linear;
    }

    /* ── BOTTOM TEXT ── */
    .bottom-txt {
      font-size: clamp(.78rem, 2vw, .88rem);
      color: rgba(255,255,255,.3);
      letter-spacing: 1.5px;
      animation: fadeDown .8s .6s ease both;
    }
    .bottom-txt span {
      color: var(--rose);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }

    /* ── FLASH OVERLAY (on redirect) ── */
    #flash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease;
    }
    #flash.go { opacity: 1; }
  </style>
</head>
<body>

  <!-- fireworks canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- stars -->
  <div id="stars"></div>

  <!-- floating particles -->
  <div id="particles"></div>

  <!-- flash overlay -->
  <div id="flash"></div>

  <!-- main content -->
  <div id="wrapper">
    <p class="top-label">A Special Message Awaits You</p>

    <p class="msg">
      Someone very special<br/>has a birthday today… 🎂
    </p>

    <!-- SVG ring countdown -->
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 160 160">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#7B2FBE"/>
            <stop offset="50%"  stop-color="#FF4D8B"/>
            <stop offset="100%" stop-color="#FFD700"/>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="80" cy="80" r="70"/>
        <circle class="ring-prog"  cx="80" cy="80" r="70" id="ringArc"/>
      </svg>
      <div class="ring-num">
        <span class="big" id="numDisplay">5</span>
        <span class="small">seconds</span>
      </div>
    </div>

    <!-- thin progress bar -->
    <div class="bar-wrap">
      <div class="bar-fill" id="barFill"></div>
    </div>

    <p class="bottom-txt">
      Redirecting to the surprise<span> ♾️</span>
    </p>
  </div>

<script>
/* ── CONFIG ── */
const TOTAL   = 5;           // countdown seconds
const DEST    = 'index.html'; // redirect target
const CIRCUMF = 2 * Math.PI * 70; // ≈ 439.8

/* ── STARS ── */
(function spawnStars(){
  const c = document.getElementById('stars');
  for(let i=0;i<130;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*3+.8;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*4+1.5).toFixed(1)}s;--dl:${(Math.random()*5).toFixed(1)}s`;
    c.appendChild(s);
  }
})();

/* ── PARTICLES ── */
const EMOJIS = ['❤️','💖','✨','🎂','🎉','🎈','💝','🌸','⭐','🥳'];
(function spawnParticles(){
  const c = document.getElementById('particles');
  for(let i=0;i<22;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
    p.style.cssText = `--lf:${Math.random()*95}%;--sz:${(Math.random()*1.2+.8).toFixed(1)}rem;--dur:${(Math.random()*6+6).toFixed(1)}s;--dl:${(Math.random()*8).toFixed(1)}s`;
    c.appendChild(p);
  }
})();

/* ── MINI FIREWORKS (canvas) ── */
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');
let sparks   = [];
function resizeCanvas(){ canvas.width=innerWidth; canvas.height=innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function firework(){
  const colors = ['#FFD700','#FF4D8B','#7B2FBE','#00CFFF','#FF6B35'];
  const sx = Math.random()*.8*innerWidth + innerWidth*.1;
  const sy = Math.random()*.45*innerHeight + innerHeight*.05;
  const col = colors[Math.floor(Math.random()*colors.length)];
  for(let j=0;j<60;j++){
    const a = (j/60)*Math.PI*2, sp = Math.random()*4+1.5;
    sparks.push({ x:sx,y:sy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                  gravity:.06, alpha:1, color:col, size:Math.random()*2.5+1 });
  }
}
function animCanvas(){
  requestAnimationFrame(animCanvas);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  sparks = sparks.filter(s=>s.alpha>.01);
  for(const s of sparks){
    s.x+=s.vx; s.y+=s.vy; s.vy+=s.gravity; s.vx*=.97; s.vy*=.97; s.alpha-=.014;
    ctx.save();
    ctx.globalAlpha = Math.max(0,s.alpha);
    ctx.fillStyle   = s.color;
    ctx.shadowBlur  = 6; ctx.shadowColor = s.color;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
animCanvas();
// fire fireworks every 1.1s throughout the countdown
setInterval(firework, 1100);
firework(); // immediate first burst

/* ── COUNTDOWN LOGIC ── */
const ringArc    = document.getElementById('ringArc');
const numDisplay = document.getElementById('numDisplay');
const barFill    = document.getElementById('barFill');
const flash      = document.getElementById('flash');

ringArc.style.strokeDasharray  = CIRCUMF;
ringArc.style.strokeDashoffset = 0;

let count = TOTAL;

// set initial bar width = full
barFill.style.transform = 'scaleX(1)';

function tick(){
  count--;

  /* ring arc shrinks */
  const frac = count / TOTAL;
  ringArc.style.strokeDashoffset = CIRCUMF * (1 - frac);

  /* bar shrinks */
  barFill.style.transform = `scaleX(${frac})`;

  /* number bounce */
  numDisplay.textContent = count > 0 ? count : '🎉';
  numDisplay.classList.remove('pop');
  void numDisplay.offsetWidth; // reflow
  numDisplay.classList.add('pop');

  if(count <= 0){
    /* white-flash then redirect */
    setTimeout(()=>{
      flash.classList.add('go');
      setTimeout(()=>{ window.location.href = DEST; }, 220);
    }, 600);
  }
}

// first tick after 1s
const timer = setInterval(()=>{
  tick();
  if(count <= 0) clearInterval(timer);
}, 1000);
</script>
</body>
</html>
